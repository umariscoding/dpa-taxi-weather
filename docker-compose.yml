services:
  spark:
    build: .
    image: dpa-taxi-weather
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # memory for the Spark driver (everything runs in local mode on one machine)
      PYSPARK_SUBMIT_ARGS: "--driver-memory 4g pyspark-shell"
    ports:
      - "4040:4040"   # Spark UI while a job is running
